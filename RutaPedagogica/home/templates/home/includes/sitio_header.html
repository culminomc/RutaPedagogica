{% load static %}
<div class="bg-[#f6efe0] border-b border-black/5">
    <div class="max-w-6xl mx-auto px-4 py-2.5 flex items-center justify-between gap-3 text-sm">
        <a href="{% firstof sitio.aif_url 'https://www.aif.gob.ar/' %}" class="inline-flex items-center gap-2 font-semibold text-ink no-underline">
            <span class="inline-grid place-items-center w-7 h-7 rounded-full" style="background: conic-gradient(#2f9e6b, #f4b000, #e11d48, #2f9e6b);" aria-hidden="true">
                <span class="w-4 h-4 rounded-full bg-[#f6efe0]"></span>
            </span>
            Gobierno de Tierra del Fuego
        </a>
        <div class="flex items-center gap-3">
            <a href="{% firstof sitio.instagram_url 'https://www.instagram.com/aif.tdf/' %}" class="hidden sm:inline-flex items-center gap-1.5 font-semibold text-ink no-underline">
                <i class="ph-bold ph-instagram-logo text-lg"></i> @aif.tdf <i class="ph ph-arrow-up-right"></i>
            </a>
            {% if request.user.is_staff and edit_url %}
            <a href="{{ edit_url }}" class="inline-flex items-center gap-2 rounded-full border border-black/10 bg-white px-3 py-1.5 font-semibold text-ink no-underline shadow-sm">
                <i class="ph ph-pencil-simple"></i> Editar esta página
            </a>
            {% else %}
            <a href="/admin/" class="inline-flex items-center gap-2 rounded-full border border-black/10 bg-white px-3 py-1.5 font-semibold text-ink no-underline shadow-sm">
                <i class="ph ph-pencil-simple"></i> Editar Datos / Media
            </a>
            {% endif %}
        </div>
    </div>
</div>

<header class="sticky top-0 z-30 bg-white shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
        <a href="{{ root }}#inicio" class="flex items-center gap-3 no-underline text-ink">
            <span class="grid place-items-center w-12 h-12 rounded-2xl bg-ink text-white">
                <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
                    <circle cx="7" cy="16" r="3" fill="#38a169"/>
                    <circle cx="18" cy="8" r="3" fill="#0056b3"/>
                    <circle cx="19" cy="18" r="3" fill="#e53e3e"/>
                    <path d="M9 14.5 L16 9.5 M9.5 16.5 L16.5 17.5" stroke="#fff" stroke-width="1.4"/>
                </svg>
            </span>
            <span>
                <span class="block font-display font-extrabold tracking-tight text-lg leading-none">RUTAS PEDAGÓGICAS</span>
                <span class="block text-[11px] tracking-[0.14em] text-neutral-500 mt-1">AGENCIA DE INNOVACIÓN FUEGUINA</span>
            </span>
        </a>
        <button type="button" class="grid place-items-center w-11 h-11" onclick="toggleMenu()" aria-label="Abrir menú">
            <i class="ph ph-list text-3xl"></i>
        </button>
    </div>
    <nav id="mobile-menu" class="hidden border-t border-black/5 bg-white">
        <div class="max-w-6xl mx-auto px-4 py-3 grid sm:grid-cols-3 gap-2 text-sm font-semibold">
            <a class="no-underline text-ink px-3 py-2 rounded-xl hover:bg-cream" href="{{ root }}#inicio">Inicio</a>
            <a class="no-underline text-ink px-3 py-2 rounded-xl hover:bg-cream" href="{{ root }}#impacto">Impacto</a>
            <a class="no-underline text-ink px-3 py-2 rounded-xl hover:bg-cream" href="{{ root }}#escuelas">Escuelas</a>
            <a class="no-underline text-ink px-3 py-2 rounded-xl hover:bg-cream" href="{{ root }}#galeria">Galería</a>
            <a class="no-underline text-ink px-3 py-2 rounded-xl hover:bg-cream" href="{{ root }}#rutas">Rutas</a>
            <a class="no-underline text-ink px-3 py-2 rounded-xl hover:bg-cream" href="{{ root }}#biblioteca">Biblioteca</a>
            <a class="no-underline text-ink px-3 py-2 rounded-xl hover:bg-cream" href="{{ root }}#contacto">Contacto</a>
            <a class="no-underline text-ink px-3 py-2 rounded-xl hover:bg-cream" href="{% firstof sitio.campus_url '/#biblioteca' %}">Campus Virtual</a>
            <a class="no-underline text-ink px-3 py-2 rounded-xl hover:bg-cream" href="/admin/">Administrar</a>
        </div>
    </nav>
</header>
